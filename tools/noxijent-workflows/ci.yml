# Noxijent CI workflow.
# Live copy: .github/workflows/ci.yml — keep this staged mirror in sync
# so the gate can be restored even if the live copy is removed.
name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        # Scoped to the harness package (deterministic gate for noxijent
        # deliverables); repo-wide turbo typecheck spans unrelated packages.
        run: bun run --cwd packages/noxijent typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@noxijent.dev"
          git config --global user.name "noxijent"

      - name: Run unit tests
        # Noxijent phase suites live under test/noxijent/ and run offline.
        working-directory: packages/noxijent
        run: bun test --timeout 30000 test/noxijent/
        env:
          CI: true

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run oxlint
        run: bunx oxlint packages/noxijent/src packages/noxijent/test packages/tui/src --config .oxlintrc.json
